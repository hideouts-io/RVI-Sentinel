name: Bug report
description: Report a reproducible defect using sanitized or synthetic evidence.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not upload packet captures, reports, baselines, endpoint inventories, device identifiers, credentials, or unsanitized logs. Report security vulnerabilities privately through SECURITY.md.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I reproduced the problem with the latest `main` revision when practical.
          required: true
        - label: I am using only devices, networks, and captures I own or am explicitly authorized to inspect.
          required: true
        - label: I removed private and identifying data from this report.
          required: true
  - type: input
    id: revision
    attributes:
      label: RVI-Sentinel revision
      description: Provide a commit SHA or other precise revision identifier.
      placeholder: Full 40-character commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Host platform
      options:
        - macOS
        - Linux
        - Windows
        - Multiple platforms
        - Platform-independent
    validations:
      required: true
  - type: input
    id: platform_version
    attributes:
      label: Platform version
      description: Provide the operating-system version and architecture, without a hostname or username.
      placeholder: macOS 26.4, Apple silicon
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - macOS capture
        - Linux or Windows capture
        - Analyzer
        - Persistent baseline
        - GUI
        - Endpoint or port enrichment
        - JSON or CSV export
        - macOS application wrapper
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Explain the defect and its impact without including sensitive investigation data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use the deterministic tests or synthetic data whenever possible.
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized command output or logs
      description: Remove usernames, absolute home paths, IPs, hostnames, serial numbers, UDIDs, tokens, and captured metadata. Do not attach a PCAP.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other non-sensitive information that helps reproduce the defect.
