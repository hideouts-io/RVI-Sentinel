name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python and native smoke
    runs-on: macos-26
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-gui.txt
      - name: Install the pinned GUI dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --disable-pip-version-check -r requirements-gui.txt
      - name: Install the real saved-file decoder
        run: brew install wireshark
      - name: Validate Python modules
        run: venv/bin/python -m py_compile analyze.py analyze_preview.py analyze_reviewed.py analyze_captured.py analysis_baseline.py packet_models.py pcapng_process.py saved_capture.py captured_dns.py dns_sessions.py dns_view.py capture_models.py capture_devices.py capture_session.py capture_receipt.py capture_stats.py capture_mobile.py gui.py gui_shell.py gui_icons.py gui_models.py packet_timeline.py packet_view.py packet_sessions.py session_view.py report_loader.py enrich_endpoints.py local_endpoint_enrichment.py finding_enrichment.py
      - name: Run deterministic analyzer and model tests
        run: |
          venv/bin/python tests/test_analyzer.py
          venv/bin/python -m tests.test_capture_models
          venv/bin/python -m tests.test_gui_models
          venv/bin/python -m tests.test_finding_enrichment
      - name: Run real saved-file decoder integrations
        run: |
          venv/bin/python -m tests.test_saved_capture
          venv/bin/python -m tests.test_pcapng_process
          venv/bin/python -m tests.test_capture_stats
          venv/bin/python -m tests.test_capture_receipts
      - name: Run offscreen GUI integration tests
        run: |
          venv/bin/python -m tests.test_gui_integration
          venv/bin/python -X faulthandler -m tests.test_gui_shell
      - name: Run packet query and Qt timeline integrations
        run: |
          venv/bin/python -m tests.test_packet_timeline
          venv/bin/python -X faulthandler -m tests.test_packet_view
          venv/bin/python -X faulthandler -m tests.test_packet_gui_integration
      - name: Run scoped session and Qt navigation integrations
        run: |
          venv/bin/python -m tests.test_packet_sessions
          venv/bin/python -X faulthandler -m tests.test_session_view
          venv/bin/python -X faulthandler -m tests.test_session_gui_integration
      - name: Run passive DNS evidence and Qt navigation integrations
        run: |
          venv/bin/python -m tests.test_captured_dns
          venv/bin/python -m tests.test_dns_sessions
          venv/bin/python -X faulthandler -m tests.test_dns_view
          venv/bin/python -X faulthandler -m tests.test_dns_gui_integration
      - name: Compile and smoke-test the native launcher
        env:
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/run_gui.sh --smoke-test
